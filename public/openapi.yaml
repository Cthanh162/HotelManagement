  openapi: 3.0.0
  info:
    title: VanBoDoi
    description: 'Anh yeu co ay nhieu lam haha<3'
    version: 1.0.0
  servers:
    -
      url: 'http://127.0.0.1:8000'
      description: 'Local API server'
  paths:
    /api/signup:
      post:
        tags:
          - auth
        summary: 'Signup a user'
        description: 'Signup a user.'
        operationId: AuthController.signup
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupRequest'
        responses:
          '201':
            description: Created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/LoggedInUserResource'
          '422':
            description: 'Unprocessable entity'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
    /api/login:
      post:
        tags:
          - auth
        summary: 'Login a user'
        description: 'Login a user.'
        operationId: AuthController.login
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRequest'
        responses:
          '200':
            description: Ok
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/LoggedInUserResource'
          '422':
            description: 'Unprocessable entity'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
          '401':
            description: Unauthorized
            content:
              application/json:
                schema:
                  properties:
                    message: { type: string, example: 'Invalid credentials.' }
                  type: object
    /api/bookings:
      get:
        tags:
          - Booking
        summary: 'Get all bookings'
        operationId: d3bb2e35cbd523590954a3025a2bd03c
        responses:
          '200':
            description: 'Booking list retrieved'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Booking'
      post:
        tags:
          - Booking
        summary: 'Tạo một đặt phòng mới'
        operationId: e33fa5a6507581f9b1e0d710a9a130d1
        requestBody:
          required: true
          content:
            application/json:
              schema:
                required:
                  - roomId
                  - checkinTime
                  - checkoutTime
                properties:
                  roomId:
                    description: 'ID của phòng'
                    type: integer
                    example: 17
                  checkinTime:
                    description: 'Thời gian check-in'
                    type: string
                    format: date-time
                    example: '2025-06-11T14:00:00Z'
                  checkoutTime:
                    description: 'Thời gian check-out'
                    type: string
                    format: date-time
                    example: '2025-06-12T12:00:00Z'
                  totalPrice:
                    description: 'Tổng giá (có thể được tính lại bởi server)'
                    type: number
                    format: float
                    example: 150
                type: object
        responses:
          '201':
            description: 'Đặt phòng được tạo'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '400':
            description: 'Yêu cầu không hợp lệ'
          '404':
            description: 'Phòng không tồn tại'
          '409':
            description: 'Phòng đã được đặt trong thời gian này'
    '/api/bookings/{bookingId}/upload-payment':
      post:
        tags:
          - Booking
        summary: 'Upload payment proof for a booking'
        operationId: 550c990a1d751937c18674f427ee31a9
        parameters:
          -
            name: bookingId
            in: path
            description: 'ID of the booking'
            required: true
            schema:
              type: integer
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                required:
                  - paymentProof
                properties:
                  paymentProof:
                    description: 'Ảnh bằng chứng thanh toán'
                    type: string
                    format: binary
                    example: image.jpg
                type: object
        responses:
          '200':
            description: 'Payment proof uploaded'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '404':
            description: 'Booking not found'
          '400':
            description: 'Invalid request or payment already uploaded'
    /api/bookings/pending:
      get:
        tags:
          - Booking
        summary: 'Lấy danh sách đặt phòng chờ duyệt'
        operationId: b25c5c46f9fdc6f4c2d658c87e635c80
        responses:
          '200':
            description: 'Danh sách đặt phòng chờ duyệt'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Booking'
          '404':
            description: 'Không có đặt phòng nào chờ duyệt'
    '/api/bookings/{bookingId}/approve':
      put:
        tags:
          - Booking
        summary: 'Duyệt thanh toán cho đặt phòng'
        operationId: ba5fa6533416a30819d205db0c2a3353
        parameters:
          -
            name: bookingId
            in: path
            description: 'ID của đặt phòng'
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Thanh toán được duyệt'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '404':
            description: 'Đặt phòng không tồn tại'
          '400':
            description: 'Trạng thái không hợp lệ để duyệt'
    '/api/bookings/{id}/confirm':
      patch:
        tags:
          - Booking
        summary: 'Confirm a booking'
        operationId: 58b8dbbe8abf604097b9e589a5e62920
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Booking confirmed'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '404':
            description: 'Booking not found'
    '/api/bookings/{id}/cancel':
      patch:
        tags:
          - Booking
        summary: 'Cancel a booking'
        operationId: 1b1bbf646a043e29766e28d7876487df
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Booking canceled'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '404':
            description: 'Booking not found'
    '/api/bookings/{id}':
      get:
        tags:
          - Booking
        summary: 'Get booking by ID'
        operationId: ae02ab266003041854cb667bef81d5ad
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Booking retrieved'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '404':
            description: 'Booking not found'
      put:
        tags:
          - Booking
        summary: 'Update a booking'
        operationId: fb300db4391c22f2232e2814d49641c7
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingRequest'
        responses:
          '200':
            description: 'Booking updated'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Booking'
          '404':
            description: 'Booking not found'
    /api/bookings/search:
      get:
        tags:
          - Booking
        summary: 'Search bookings by hotel or floor'
        operationId: b80406e5c5e44467e6e01ee28135cf53
        parameters:
          -
            name: hotelId
            in: query
            required: false
            schema:
              type: integer
          -
            name: floor
            in: query
            required: false
            schema:
              type: integer
        responses:
          '200':
            description: 'Bookings found'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Booking'
    /api/hotels:
      get:
        tags:
          - hotels
        summary: 'List all hotels'
        operationId: HotelController.get
        responses:
          '200':
            description: 'List of hotels'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Hotel'
      post:
        tags:
          - hotels
        summary: 'Create a new hotel'
        operationId: HotelController.create
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateHotelRequest'
        responses:
          '201':
            description: 'Hotel created'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Hotel'
    '/api/hotels/{id}':
      get:
        tags:
          - hotels
        summary: 'Get a specific hotel'
        operationId: HotelController.getById
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Hotel detail'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Hotel'
          '404':
            description: 'Not found'
      put:
        tags:
          - hotels
        summary: 'Update hotel info'
        operationId: HotelController.update
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateHotelRequest'
        responses:
          '200':
            description: 'Hotel updated'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Hotel'
          '404':
            description: 'Not found'
      delete:
        tags:
          - hotels
        summary: 'Delete a hotel'
        operationId: HotelController.delete
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '204':
            description: 'No Content'
          '404':
            description: 'Not found'
    /api/floors:
      get:
        tags:
          - floors
        summary: 'Get all floors for a hotel'
        operationId: 1c2bcb89b618a7c6b906ddf1d1035b44
        parameters:
          -
            name: hotelId
            in: query
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'List of floors'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Floor'
      post:
        tags:
          - floors
        summary: 'Create a new floor for a hotel'
        operationId: 6d5eb48fcf11428aad0f3e572a7580aa
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFloorRequest'
        responses:
          '201':
            description: 'Floor created'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Floor'
    '/api/floors/{id}':
      get:
        tags:
          - floors
        summary: 'Get floor by ID'
        operationId: 1c111640a4bc636501a9424d2acc4955
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Floor found'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Floor'
      put:
        tags:
          - floors
        summary: 'Update floor'
        operationId: fd506d6157b4e618ad91aa4804f93a86
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFloorRequest'
        responses:
          '200':
            description: 'Floor updated'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Floor'
          '404':
            description: 'Floor not found'
      delete:
        tags:
          - floors
        summary: 'Delete floor'
        operationId: 05a4bb1ddf5a08c8a404af8ea71f132d
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '204':
            description: 'Floor deleted'
    /api/profile:
      get:
        tags:
          - profile
        summary: me
        description: 'Get the authenticated user.'
        operationId: ProfileController.me
        responses:
          '200':
            description: Ok
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResource'
        security:
          -
            BearerToken: []
    /api/reviews:
      get:
        tags:
          - reviews
        summary: 'List all reviews'
        operationId: ReviewController.index
        responses:
          '200':
            description: 'List of reviews'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Review'
      post:
        tags:
          - reviews
        summary: 'Create a new review after checkout'
        operationId: ReviewController.store
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewRequest'
        responses:
          '201':
            description: 'Review created'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Review'
    '/api/reviews/{id}':
      get:
        tags:
          - reviews
        summary: 'Get a specific review'
        operationId: ReviewController.show
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Review details'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Review'
      delete:
        tags:
          - reviews
        summary: 'Delete a review'
        operationId: ReviewController.destroy
        parameters:
          -
            name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '204':
            description: Deleted
    /api/rooms:
      get:
        tags:
          - rooms
        summary: 'Get all rooms'
        operationId: bea681612754126f01807ff95647eb34
        responses:
          '200':
            description: 'Rooms retrieved'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Room'
      post:
        tags:
          - rooms
        summary: 'Create a new room with image and video upload using Cloudinary'
        operationId: cd6c1029f22e2425a1f99cf83e27383a
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                required:
                  - hotelId
                  - floorId
                  - roomName
                  - status
                  - roomType
                  - capacity
                  - children
                  - adults
                  - price
                properties:
                  hotelId:
                    description: 'ID of the hotel'
                    type: integer
                    example: 1
                  floorId:
                    description: 'ID of the floor in the hotel'
                    type: integer
                    example: 2
                  roomName:
                    description: 'Room Name'
                    type: string
                    example: 'Deluxe Room'
                  roomImages:
                    description: 'Images for the room (send as roomImages[] for multiple files)'
                    type: array
                    items: { type: string, format: binary }
                  roomVideo:
                    description: 'Video for the room'
                    type: string
                    format: binary
                  status:
                    description: 'Room status (e.g., available, booked)'
                    type: string
                    example: available
                  roomType:
                    description: 'Type of the room (e.g., deluxe, standard)'
                    type: string
                    example: luxury
                  capacity:
                    description: 'Number of people the room can accommodate'
                    type: integer
                    example: 2
                  children:
                    description: 'Number of children the room can accommodate'
                    type: integer
                    example: 2
                  adults:
                    description: 'Number of adults the room can accommodate'
                    type: integer
                    example: 2
                  price:
                    description: 'Room price per night'
                    type: number
                    format: float
                    example: 150
                  description:
                    description: 'Room description'
                    type: string
                    example: 'A beautiful deluxe room with ocean view.'
                type: object
        responses:
          '201':
            description: 'Room created successfully'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Room'
          '400':
            description: 'Invalid input data'
            content:
              application/json:
                schema:
                  properties:
                    message: { type: string, example: 'Invalid hotelId or floorId.' }
                    errors: { type: object, example: { hotelId: ['The hotel does not exist.'], floorId: ['The floor does not belong to the provided hotel.'] } }
                  type: object
    '/api/rooms/{roomId}':
      get:
        tags:
          - rooms
        summary: 'Lấy thông tin phòng theo ID'
        operationId: c4fe2b4e172e2c3c28f68b2d805379f1
        parameters:
          -
            name: roomId
            in: path
            description: 'ID của phòng'
            required: true
            schema:
              type: integer
        responses:
          '200':
            description: 'Phòng đã được lấy'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Room'
          '404':
            description: 'Không tìm thấy phòng'
            content:
              application/json:
                schema:
                  properties:
                    message: { type: string, example: 'Không tìm thấy phòng.' }
                  type: object
      put:
        tags:
          - rooms
        summary: 'Cập nhật một phòng hiện có'
        operationId: e251ce2d47368a4158caaf363e17b80f
        parameters:
          -
            name: roomId
            in: path
            description: 'ID của phòng'
            required: true
            schema:
              type: integer
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                properties:
                  hotelId:
                    description: 'ID của khách sạn'
                    type: integer
                    example: 1
                  floorId:
                    description: 'ID của tầng trong khách sạn'
                    type: integer
                    example: 2
                  roomName:
                    description: 'Tên phòng'
                    type: string
                    example: 'Deluxe Room'
                  roomImages:
                    description: 'Mảng ảnh của phòng (gửi dưới dạng roomImages[] cho nhiều file)'
                    type: array
                    items: { type: string, format: binary }
                  roomVideo:
                    description: 'Video của phòng'
                    type: string
                    format: binary
                  status:
                    description: 'Trạng thái phòng (ví dụ: available, booked, maintenance)'
                    type: string
                    example: available
                  roomType:
                    description: 'Loại phòng (ví dụ: deluxe, standard, luxury)'
                    type: string
                    example: luxury
                  capacity:
                    description: 'Số người phòng có thể chứa'
                    type: integer
                    example: 2
                  children:
                    description: 'Số trẻ em phòng có thể chứa'
                    type: integer
                    example: 2
                  adults:
                    description: 'Số người lớn phòng có thể chứa'
                    type: integer
                    example: 2
                  price:
                    description: 'Giá phòng mỗi đêm'
                    type: number
                    format: float
                    example: 150
                  description:
                    description: 'Mô tả phòng'
                    type: string
                    example: 'Phòng deluxe tuyệt đẹp với tầm nhìn ra biển.'
                type: object
        responses:
          '200':
            description: 'Phòng đã được cập nhật'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Room'
          '404':
            description: 'Không tìm thấy phòng'
            content:
              application/json:
                schema:
                  properties:
                    message: { type: string, example: 'Không tìm thấy phòng.' }
                  type: object
          '400':
            description: 'Dữ liệu đầu vào không hợp lệ'
            content:
              application/json:
                schema:
                  properties:
                    message: { type: string, example: 'Invalid hotelId or floorId.' }
                    errors: { type: object, example: { hotelId: ['Khách sạn không tồn tại.'], floorId: ['Tầng không thuộc khách sạn đã chọn.'] } }
                  type: object
      delete:
        tags:
          - rooms
        summary: 'Xóa một phòng theo ID'
        operationId: 9d53e6dc614ef4465910416e33373133
        parameters:
          -
            name: roomId
            in: path
            description: 'ID của phòng'
            required: true
            schema:
              type: integer
        responses:
          '204':
            description: 'Phòng đã được xóa'
          '404':
            description: 'Không tìm thấy phòng'
            content:
              application/json:
                schema:
                  properties:
                    message: { type: string, example: 'Không tìm thấy phòng.' }
                  type: object
    /api/rooms/search:
      get:
        tags:
          - rooms
        summary: 'Search for available rooms with optional filters'
        operationId: 2b690986b5a6437e0a9d1fcac2f1cd82
        parameters:
          -
            name: roomType
            in: query
            required: false
            schema:
              type: string
          -
            name: capacity
            in: query
            required: false
            schema:
              type: integer
          -
            name: adults
            in: query
            required: false
            schema:
              type: integer
          -
            name: children
            in: query
            required: false
            schema:
              type: integer
          -
            name: minPrice
            in: query
            required: false
            schema:
              type: number
          -
            name: maxPrice
            in: query
            required: false
            schema:
              type: number
        responses:
          '200':
            description: 'List of matching rooms'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Room'
    /api/rooms/suggestions:
      get:
        tags:
          - rooms
        summary: 'Get room suggestions by booking count and rating'
        operationId: e6462071b6af40c101140f599214f98f
        responses:
          '200':
            description: 'Suggested rooms'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Room'
    /api/statistics/revenue/daily:
      get:
        tags:
          - Statistics
        summary: 'Thống kê doanh thu theo ngày'
        operationId: d34e1fe8b83ae3b7ac30232709bfa9ea
        parameters:
          -
            name: date
            in: query
            required: true
            schema:
              type: string
              format: date
            example: '2025-05-01'
          -
            name: hotelId
            in: query
            description: 'ID của khách sạn'
            required: true
            schema:
              type: integer
              example: 1
        responses:
          '200':
            description: 'Doanh thu theo ngày của khách sạn'
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/RevenueStat'
          '400':
            description: 'Dữ liệu không hợp lệ'
    /api/statistics/revenue/monthly:
      get:
        tags:
          - Statistics
        summary: 'Thống kê doanh thu theo tháng'
        operationId: ba5511908735b849a9620f24849ce9f5
        parameters:
          -
            name: month
            in: query
            description: 'Tháng cho thống kê doanh thu (format: YYYY-MM)'
            required: true
            schema:
